<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#028427"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="800" height="800" rx="160" fill="url(#bg)"/>

  <!-- Abstract document/pencil symbol -->
  <!-- Document body -->
  <rect x="220" y="200" width="360" height="400" rx="20" fill="white" opacity="0.95"/>

  <!-- Document folded corner -->
  <path d="M580 200 L580 280 L500 280 Z" fill="white" opacity="0.8"/>

  <!-- Document lines (abstract text) -->
  <rect x="300" y="280" width="200" height="12" rx="6" fill="#028427" opacity="0.5"/>
  <rect x="300" y="320" width="200" height="12" rx="6" fill="#028427" opacity="0.5"/>
  <rect x="300" y="360" width="160" height="12" rx="6" fill="#028427" opacity="0.5"/>
  <rect x="300" y="400" width="200" height="12" rx="6" fill="#028427" opacity="0.5"/>
  <rect x="300" y="440" width="120" height="12" rx="6" fill="#028427" opacity="0.5"/>

  <!-- Pencil (abstract editing tool) -->
  <rect x="470" y="470" width="110" height="24" rx="12" fill="#028427" transform="rotate(-15 525 482)"/>
  <rect x="560" y="460" width="30" height="30" rx="8" fill="#028427" transform="rotate(-15 575 475)"/>

  <!-- Abstract spark/scan line -->
  <path d="M220 180 Q280 160 340 180 T460 180" stroke="#4ade80" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
